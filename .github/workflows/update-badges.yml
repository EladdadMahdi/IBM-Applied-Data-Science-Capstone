name: Update Badges
on: [push, workflow_dispatch]
permissions:
  contents: write  # ← Cette ligne fixe le 403 !

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install packages
      run: pip install scikit-learn pandas numpy matplotlib seaborn
    - name: Generate badges
      run: |
        echo '<!-- AUTO BADGES -->' > badges.txt
        echo '![scikit-learn](https://img.shields.io/badge/scikit_learn-1.8.0-blue)' >> badges.txt
        echo '![pandas](https://img.shields.io/badge/pandas-2.2.3-green)' >> badges.txt
        echo '![numpy](https://img.shields.io/badge/numpy-1.26.4-yellow)' >> badges.txt
        echo '<!-- /AUTO BADGES -->' >> badges.txt
    - name: Update README
      run: |
        sed -i '/<!-- AUTO BADGES -->/,/<!-- \/AUTO BADGES -->/d' README.md
        cat badges.txt >> README.md
    - name: Commit
      uses: EndBug/add-and-commit@v9
      with:
        message: '🤖 Update badges'
